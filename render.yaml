services:
  - type: web
    name: interviewmate-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # Set this manually in Render dashboard
      - key: MONGODB_URL
        sync: false          # Set this to your MongoDB Atlas connection string
      - key: MONGODB_DATABASE
        value: interviewmate
      - key: GOOGLE_CLIENT_ID
        sync: false          # Google OAuth Client ID
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false          # Gmail address for sending OTPs
      - key: SMTP_PASSWORD
        sync: false          # Gmail App Password
      - key: SMTP_FROM
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: web
    env: static
    name: interviewmate-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false          # Set to backend URL: https://interviewmate-backend.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false          # Same Google Client ID for frontend
      - key: VITE_GEMINI_API_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
