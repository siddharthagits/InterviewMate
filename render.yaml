services:
  - type: web
    name: interviewmate-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # Set this manually in Render dashboard
      - key: MONGODB_URL
        sync: false          # Set this to your MongoDB Atlas connection string
      - key: MONGODB_DATABASE
        value: interviewmate
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: web
    env: static
    name: interviewmate-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false          # Set to your backend URL, e.g. https://interviewmate-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
